<!doctype html>
<html lang="en" data-theme="forge-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Forge IDE — a real development environment in the browser</title>
    <meta
      name="description"
      content="Forge is a browser-based IDE with the Monaco editor, an in-browser esbuild bundler, a working shell, version control and a sandboxed live preview."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#080b11" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Fonts are self-hosted: no third-party request, no render-blocking
         round trip, and the app still looks right offline.

         They are deliberately not preloaded. Nothing paints in a webfont until
         React has mounted behind a large editor chunk, so a preload issued here
         expires unused — Chromium logs a warning for it on every production
         load, and the two eager requests compete with the entry bundle for
         bandwidth. `font-display: swap` in fonts.css covers the swap-in. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Forge IDE" />
    <meta
      property="og:description"
      content="Editor, terminal, bundler, version control and preview — running entirely in your browser."
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui; color: #e2e8f5">
        Forge IDE needs JavaScript. It compiles and runs your code in the browser, so there is no
        server-rendered fallback.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
