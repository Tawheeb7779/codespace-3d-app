# Deploy the ai-proxy Edge Function to Supabase.
#
# Manual only. This function holds the deployment's Gemini credential and is
# the single path from a browser session to the provider, so a deploy is a
# deliberate act rather than something that happens on every push.
#
# This file lives on the default branch because that is the only place GitHub
# will offer a workflow_dispatch run from. The code it deploys does not: the
# checkout below names the development branch explicitly, so running this from
# main deploys that branch's ai-proxy and nothing of main's.
#
# Nothing here is a secret except SUPABASE_ACCESS_TOKEN. The project ref is in
# the URL of every request the app already makes, and GEMINI_API_KEY is not
# set here on purpose: it belongs to the Edge Function's own environment and is
# managed with `supabase secrets set`. A key added to GitHub would be a second
# copy of it in a second place, which is one more place to leak from.
name: Deploy ai-proxy

on:
  workflow_dispatch:

# Read-only: this job checks out code and talks to Supabase. It has no reason
# to write to the repository.
permissions:
  contents: read

# One deploy at a time. Two overlapping runs would race to replace the same
# function, and the one that finished last would win regardless of which was
# newer.
concurrency:
  group: deploy-ai-proxy
  cancel-in-progress: false

env:
  PROJECT_REF: awgdurlvfqxtdadpuzse
  FUNCTION_NAME: ai-proxy
  SOURCE_BRANCH: claude/forge-ide-build-ik8j7k

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Explicitly the development branch, not the ref this was dispatched
      # from. main does not carry the function, so checking out the dispatch
      # ref would find nothing to deploy.
      - name: Check out the branch that holds the function
        uses: actions/checkout@v4
        with:
          ref: claude/forge-ide-build-ik8j7k

      - name: Report what is being deployed
        run: |
          echo "source branch: ${SOURCE_BRANCH}"
          echo "commit:        $(git rev-parse HEAD)"
          echo "function:      ${FUNCTION_NAME}"
          echo "project:       ${PROJECT_REF}"

      # Fail here rather than at the CLI. A branch without this file would
      # otherwise reach `functions deploy` and produce a less obvious error.
      - name: Confirm the function exists
        run: |
          test -f "supabase/functions/${FUNCTION_NAME}/index.ts" \
            || { echo "::error::supabase/functions/${FUNCTION_NAME}/index.ts is not present on ${SOURCE_BRANCH}"; exit 1; }

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Only this function. The repository also holds github-oauth and
      # github-proxy, and naming the function explicitly is what keeps an
      # unrelated one from being replaced by a deploy nobody asked for.
      - name: Deploy ${{ env.FUNCTION_NAME }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "${SUPABASE_ACCESS_TOKEN}" \
            || { echo "::error::SUPABASE_ACCESS_TOKEN is not set for this repository"; exit 1; }
          supabase functions deploy "${FUNCTION_NAME}" --use-api --project-ref "${PROJECT_REF}"
